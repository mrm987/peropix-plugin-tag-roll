<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>태그 굴리기</title>
<!--
  PeroPix 플러그인 「태그 굴리기」 — 원본은 `danbooru-dump/_scripts/roll_server.py` 안의 HTML 이다 (2026-09-10 이식).
  ★★**창 골격은 앱이 준다** (사용자 지시 2026-09-10 *"박스 자체가 앱인 느낌"*): `header`(도구줄) · `main`(본문) ·
    창을 키우면 본문만 커지고 스크롤도 본문 안에서만 난다. (상태줄은 2026-09-11 에 걷었다 — 크기를 보고
    할 일이 없었고, 받는 중 진행률은 색인 안내 화면이 이미 보여 준다.)
  ★색은 한 곳도 박아 쓰지 않는다 — 전부 `/plug/_app/base.css` 의 앱 토큰이라 테마를 따라간다.
  ★이식하면서 옮긴 것 하나: 원본 도구줄의 아래 칸(옵션 20여 개)은 본문 맨 위의 「옵션」 카드로 내렸다.
    도구줄에 두면 창이 좁을 때 다섯 줄로 접혀 본문이 없어진다.
  ★원본이 서버에서 HTML 에 박아 넣던 두 목록(모듈별 온도·구도)은 화면이 정적 파일이 되었으므로
    `../api/slots` 를 받은 뒤 JS 가 채운다.
  ★★고친 결함 하나 — **원본에도 있다** (실측 2026-09-10, 원본 서버를 8767 로 띄워 같은 예외 확인):
    장르를 하나도 안 고르고 굴리면 응답의 `seg` 가 `[]`·`seg_n` 이 null 인데, 상태 줄이 옛 형태(`seg !== 'all'`)로
    판정해 null 에 `toLocaleString()` 을 불러 `render` 가 중간에 죽었다. 부위 칩은 그려지고 묶음 줄·상태 줄만
    「굴리는 중…」에 머물러 **굴리기가 안 되는 것처럼 보인다.** 조건을 「장르가 실제로 걸렸을 때」로 바꿨다.
  ★창구 주소는 `../api/…` 다 — 이 페이지는 `/plug/tag-roll/web/` 에 서빙되고 라우터는 한 단계 위
    `/plug/tag-roll/` 에 붙는다. `./api/…` 로 적으면 정적 폴더 아래를 가리켜 404 가 온다 (실측 2026-09-10:
    게스트 화면이 「색인 0MB」 로 떴다 — 404 의 JSON 을 상태로 읽었다).
-->
<!-- ★★**상대 경로여야 한다** (2026-09-12 실측). 배포본은 모든 주소에 **이번 실행의 열쇠**가
     앞머리로 붙는데(`/<키>/plug/<id>/web/`), `/plug/_app/…` 로 적으면 그 앞머리를 건너뛰어
     403 을 받는다 — 스타일이 하나도 안 실려 **흰 바탕에 글자만** 나온다.
     개발 환경은 열쇠가 없어 절대 경로도 통해서, 배포본에서만 드러났다. -->
<link rel="stylesheet" href="../../_app/base.css">
<script src="../../_app/peropix.js"></script>
<script src="i18n.js"></script>
<style>
/* 도구줄 */
header input[type=text]{width:min(320px,42vw)}
header #seedbox input{width:84px}
#sug{position:absolute;top:100%;left:0;z-index:9;min-width:280px;max-height:260px;overflow:auto;
     background:var(--panel);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-2,0 6px 18px rgba(0,0,0,.18))}
#sug div{padding:4px 10px;cursor:pointer;font-size:var(--text-xs)}
#sug div:hover{background:var(--accent-bg);color:var(--accent-ink)}
.sep{width:1px;height:16px;background:var(--line)}
#tdet{position:relative;font-size:var(--text-2xs)}
#tdet summary{cursor:pointer;color:var(--ink-soft);list-style:none}
#tdet summary::-webkit-details-marker{display:none}
#tdet summary::after{content:" ▾"}
#tdet[open] summary::after{content:" ▴"}
#tdet .tgrid{position:absolute;top:22px;left:0;z-index:8;background:var(--panel);border:1px solid var(--line);
             border-radius:var(--r-3);padding:8px 12px;display:grid;grid-template-columns:auto auto;gap:4px 10px;white-space:nowrap}

/* 굴린 결과 묶음 — 스위치 · 이름 · 태그 · 다시 */
#top .bundle{display:grid;grid-template-columns:28px 52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line-soft)}
#top .bundle:first-child{border-top:0}
.sw{width:26px;height:15px;border-radius:999px;background:var(--line-strong,var(--line));position:relative;cursor:pointer;flex:0 0 auto}
.sw i{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:999px;background:var(--panel);transition:left .12s}
.sw.on{background:var(--accent)}
.sw.on i{left:13px}
.sw.hide{visibility:hidden}
#top .bundle .k{font-weight:var(--w-semi);color:var(--ink-soft);font-size:var(--text-xs)}
#top .bundle .v{font-family:var(--font-mono);font-size:var(--text-xs);white-space:pre-wrap;min-height:18px;min-width:0;word-break:break-word}
#top .bundle .v.empty{color:var(--ink-faint)}
#top .bundle .btns{display:flex;gap:4px}
#top .all{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:9px;margin-top:5px;border-top:1px solid var(--line)}

/* 부위 칩 */
.slot{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.slot .lab{font-weight:var(--w-semi);font-size:var(--text-xs);padding-top:5px}
.slot .lab small{display:block;font-weight:var(--w-norm);color:var(--ink-faint)}
.chip{display:inline-block;margin:3px 4px 3px 0;padding:4px 9px;border-radius:999px;background:var(--code-bg);
      border:1px solid var(--line);cursor:pointer;font-size:var(--text-xs)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink);font-weight:var(--w-semi)}
.chip.anchor{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip.none{background:transparent;color:var(--ink-dim)}
.chip small{color:var(--ink-dim);margin-left:4px}
.chip.on small{color:var(--accent-ink)}
.meta{color:var(--ink-dim);font-size:var(--text-2xs);margin-top:6px}

.tri{display:inline-block;font-size:var(--text-2xs);margin:1px 9px 1px 0;white-space:nowrap;cursor:pointer;user-select:none;color:var(--ink-faint)}
.tri:before{content:'☐ ';color:var(--ink-faint)}
.tri.s1{color:var(--ink)}
.tri.s1:before{content:'● ';color:var(--accent)}
.tri.s2{color:var(--ink)}
.tri.s2:before{content:'★ ';color:#d8a33a}
.tri.muted{opacity:.35;text-decoration:line-through;cursor:default}

/* 인물 탭 */
#ptabs{display:flex;gap:0}
#ptabs button{border-radius:0}
#ptabs button:first-child{border-radius:var(--r-2) 0 0 var(--r-2)}
#ptabs button:last-child{border-radius:0 var(--r-2) var(--r-2) 0}
#ptabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}

/* 색인 안내 (색인이 없거나 받는 중일 때만 보인다) */
#gate{display:none}
#gate.show{display:block}
#gate .bar{height:8px;border-radius:999px;background:var(--code-bg);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
#gate .bar i{display:block;height:100%;background:var(--accent);width:0}
/* 두 칸 — 왼쪽은 굴리기 전에 정하는 것, 오른쪽은 결과 (사용자 지시 2026-09-12) */
#work{display:none}
#work.show{display:flex;gap:var(--sp-5);flex:1;min-height:0}
#cond{width:344px;flex:0 0 auto;display:flex;flex-direction:column;overflow:auto;padding:0}
#cond .ctitle{padding:11px 12px 9px;border-bottom:1px solid var(--line);font-weight:var(--w-bold)}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-4);min-height:0}
/* 조건 패널의 한 덩이 */
.grp{padding:9px 12px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:4px}
.gh b{font-size:var(--text-xs);font-weight:var(--w-semi)}
.gh .cnt{font-size:var(--text-3xs);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.zrow{display:grid;grid-template-columns:50px 1fr;gap:2px 8px;align-items:start;padding:4px 0;border-top:1px solid var(--line-soft)}
.zrow:first-of-type{border-top:0}
.zrow .zn{font-size:var(--text-3xs);color:var(--accent-ink);padding-top:4px}
.zrow .zs,.chips{display:flex;flex-wrap:wrap;gap:2px 6px}
.grp .row{gap:var(--sp-3) var(--sp-4)}
/* 굴리기 카드 — 넣고 → 굴리고 → 받는다 */
#runcard{flex:0 0 auto;padding:11px 13px;display:flex;flex-direction:column;gap:var(--sp-4)}
#runcard .ins{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
#runcard .ins input{width:100%}
#runcard .go{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
#runcard .res{border-top:1px solid var(--line);padding-top:var(--sp-3);display:flex;flex-direction:column}
#runcard .res h3{margin:0 0 4px;font-size:var(--text-md)}
/* 모듈 칩 */
#modtabs{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto;flex-wrap:wrap}
#modtabs .pill{cursor:pointer;padding:0 var(--sp-4);line-height:25px;font-size:var(--text-xs)}
#modtabs .pill.off{opacity:.45}
#modbody{flex:1;min-height:0;overflow:auto}
#modbody .card{padding:0}
#modbody .mhead{display:flex;align-items:center;gap:var(--sp-3);padding:9px 12px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:var(--panel);z-index:1}
#modbody .mhead b{font-size:var(--text-md)}
#modbody .mbody{padding:2px 12px 10px}
</style>
</head>
<body>
<main>
<section id="gate" class="card">
 <h2 data-t="색인을 내려받아야 굴릴 수 있습니다">색인을 내려받아야 굴릴 수 있습니다</h2>
 <p class="meta" id="g_what"><span data-t="danbooru 색인">danbooru 색인</span> <b id="g_size">약 960MB</b> <span data-t="— 태그가 함께 쓰인 빈도를 재는 표입니다. 한 번 받으면 계속 씁니다.">— 태그가 함께 쓰인 빈도를 재는 표입니다. 한 번 받으면 계속 씁니다.</span></p>
 <div class="bar"><i id="g_fill"></i></div>
 <p class="meta" id="g_state" data-t="확인하는 중…">확인하는 중…</p>
 <div class="row">
  <button class="primary" id="g_go" data-t="색인 내려받기">색인 내려받기</button>
  <button id="g_stop" hidden data-t="멈추기">멈추기</button>
  <span class="spacer"></span>
  <span class="meta" id="g_dir"></span>
 </div>
</section>

<div id="work">
 <!-- ── 왼쪽: 굴리기 전에 정하는 것 ── -->
 <aside id="cond" class="card">
  <div class="ctitle" data-t="굴리기 조건">굴리기 조건</div>
  <div id="bodymap"></div>
  <div class="grp">
   <div class="gh"><b data-t="표본">표본</b></div>
   <div class="row">
    <label data-t-title="같은 캐릭터 태그의 그림을 표본에 이 장수까지만 넣습니다. 작은 표본에서 인기 캐릭터 한 명이 디자인을 지배하는 것을 막습니다 (오리지널 그림은 상한 없음). 「없음」이면 순수 빈도"><select id="charcap" onchange="repaint()"><option value="0" data-t="캐릭터당 상한 없음">캐릭터당 상한 없음</option><option value="30" data-t="캐릭터당 30장">캐릭터당 30장</option><option value="100" selected data-t="캐릭터당 100장">캐릭터당 100장</option><option value="300" data-t="캐릭터당 300장">캐릭터당 300장</option></select></label>
    <label><select id="rating" onchange="repaint()"><option value="all" data-t="전 등급">전 등급</option><option value="gs" data-t="전연령만">전연령만</option></select></label>
    <label data-t-title="켜면 동물귀·꼬리 계열 태그를 후보에서 뺍니다. 끄면 다른 태그와 똑같이 확률대로 나옵니다"><input type="checkbox" id="nokemono" onchange="repaint()"> <span data-t="수인 제외">수인 제외</span></label>
    <label data-t-title="켜면 흔한 조합 대신 이 앵커에서 유독 같이 쓰이는 태그 쪽으로 뽑습니다 (conf × lift^0.8)"><input type="checkbox" id="focus" onchange="repaint()"> <span data-t="앵커 특화">앵커 특화</span></label>
   </div>
  </div>
  <div class="grp">
   <div class="gh"><b data-t="인물">인물</b></div>
   <div class="row">
    <label data-t-title="1 이면 여러 명이 있어야 성립하는 태그(eye contact·looking at another·straddling·pov)를 후보에서 뺍니다. 2 이상이면 그 태그를 되돌리고 신체·복장·표정·포즈를 인물 수만큼 따로 굴립니다 (씬은 한 벌)"><select id="people" onchange="repaint()"><option value="1" data-t="1명">1명</option><option value="2" data-t="2명">2명</option><option value="3" data-t="3명">3명</option></select></label>
    <label><span data-t="시드">시드</span> <input id="seed" type="text" style="width:96px"></label>
   </div>
  </div>
 </aside>

 <!-- ── 오른쪽: 넣고 → 뽑고 → 받는다 ── -->
 <section id="stage">
  <div class="card" id="runcard">
   <div class="ins">
    <div style="position:relative">
     <div class="muted" style="margin-bottom:4px" data-t="필수 포함 태그">필수 포함 태그</div>
     <input id="tag" type="text" data-t-ph="serafuku, white_thighhighs" autocomplete="off"><div id="sug" hidden></div>
    </div>
    <div style="position:relative">
     <div class="muted" style="margin-bottom:4px" data-t="제외 태그">제외 태그</div>
     <input id="excl" type="text" data-t-ph="monochrome, blurry" autocomplete="off"><div id="sug2" hidden></div>
    </div>
   </div>
   <div class="go">
    <label><span data-t="온도">온도</span> <input id="temp" type="range" min="0.3" max="2.5" step="0.1" value="1.0" oninput="tv.textContent=this.value" onchange="repaint()"> <span id="tv">1.0</span></label>
    <details id="tdet" data-t-title="모듈마다 온도를 따로 정합니다. 「전체 따름」이면 위 슬라이더 값을 씁니다"><summary data-t="모듈별">모듈별</summary>
     <div class="tgrid"><!--MODTEMPS--></div></details>
    <span class="spacer"></span>
    <button class="primary" id="btnRoll" onclick="roll(true)" data-t="굴리기">굴리기</button>
    <button id="btnRollPut" onclick="rollAndPut(this)" data-t-title="굴린 뒤 결과를 바로 지금 씬에 넣습니다 (내가 넣었던 블록은 먼저 지웁니다)" data-t="굴리기+넣기">굴리기+넣기</button>
   </div>
   <div class="res">
    <h3 data-t="이번에 굴린 프롬프트">이번에 굴린 프롬프트</h3>
    <div id="ptabs"></div>
    <div id="top"></div>
   </div>
  </div>

  <div id="modtabs"></div>
  <div id="modbody"></div>
 </section>
</div>
</main>

<!-- 화면에서 안 보이지만 코드가 값을 읽는 것들 — 착의와 모듈 켜기는 제자리(복장 머리 · 결과 줄)에서 만진다 -->
<div hidden id="stash">
 <select id="mode" onchange="applyMode()"><option value="dressed" data-t="전부 입기">전부 입기</option><option value="nude" data-t="누드">누드</option><option value="bare" data-t="완전 누드">완전 누드</option></select>
 <input type="checkbox" id="nsfw_on" checked onchange="repaint()">
 <input type="checkbox" id="expr_on" checked onchange="repaint()">
 <input type="checkbox" id="pose_on" checked onchange="repaint()">
 <input type="checkbox" id="scene_on" checked onchange="repaint()">
 <select id="level" onchange="repaint()"><option value="1" data-t="약">약</option><option value="2" selected data-t="중">중</option><option value="3" data-t="강">강</option></select>
 <input type="checkbox" id="lockact" onchange="repaint()">
 <select id="bg" onchange="repaint()"><option value="auto" data-t="통계대로">통계대로</option><option value="simple" data-t="단순">단순</option><option value="real" data-t="실경">실경</option></select>
 <input type="checkbox" id="nowhite" onchange="repaint()">
 <select id="frame_sel" onchange="repaint()"><option value="auto" data-t="구도 자동">구도 자동</option><!--FRAMES--></select>
</div>

<script>
let fixed={}, cur=null, scur=null, sfixed={}, sseed=0, SL=null, pcur=null, pfixed={}, pseed=0, xcur=null, xfixed={}, xseed=0;
// ── 문구 (사전은 `i18n.js`. 한국어 원문이 키다) ──────────────────────────────
// ★서버가 내는 오류는 「앞머리: 값」 꼴이라, 앞머리만 사전에서 찾고 값은 그대로 둔다.
function SE(m){m=String(m||'');const i=m.indexOf(': ');
 if(i>0){const h=m.slice(0,i);const tr=T(h);if(tr!==h)return tr+': '+m.slice(i+2)}
 return T(m)}
const LOC=()=>({ko:'ko-KR',en:'en-US',ja:'ja-JP'})[tagrollLang()]||'ko-KR';
/** 조건 줄 — 조건이 있으면 개수, 없으면 「표본만」·「행위만」 */
const condN=(s,none)=>(s.cond&&s.cond.length)?T('조건 {n}개',{n:s.cond.length}):T(none);
/** 부위 줄의 장수·다중 슬롯 꼬리 */
const nImg=n=>T('{n}장',{n:n.toLocaleString(LOC())});
const kTail=s=>s.k>1?' · '+T('최대 {k}개 (칩을 눌러 더하거나 뺌)',{k:s.k}):'';
// ---- 인원수 (사용자 지시 2026-09-08) ----
// 인물마다 디자인·표정·포즈를 따로 굴린다. 씬·NSFW 는 한 벌이고 인물 1 의 디자인을 조건으로 쓴다.
// 화면은 탭으로 한 인물씩 보여 준다 — 슬롯이 인물당 33개라 늘어놓으면 훑기 어렵다. 위 묶음에는 인물별 전체 태그가 뜬다.

  const none=s.none_p!=null?`<span class="chip none ${s.chosen?'':'on'}" onclick="setFixed('${s.slot}','')">${T('없음')}<small>${(s.none_p*100).toFixed(0)}%</small></span>`:'';
  const src=`${(s.cond&&s.cond.length)?T('질의 {n}개',{n:s.cond.length}):T('질의 앵커만')} · ${T('완전 일치 {n}장',{n:s.n.toLocaleString(LOC())})}`;
  return `<div class="slot"><div class="lab">${T(s.label)}<small>${src}</small></div><div>${extra}${chips}${none}</div></div>`}).join('');
 $('#meta').textContent=T('시드 {seed} · 온도 {temp} · {rating}',{seed:d.seed,temp:d.temp,rating:d.rating==='gs'?T('전연령'):T('전 등급')})
  +(d.anchor_random?T(' · 랜덤 앵커 「{tag}」 (칸을 비워 두면 굴릴 때마다 새로 뽑습니다)',{tag:d.anchor.replace(/_/g,' ')}):'')
  +T(' · 앵커 그림 {n}장',{n:d.n_anchor.toLocaleString(LOC())})
  +(d.charcap?T(' (캐릭터당 {cap}장 상한 · 상한 전 {raw}장)',{cap:d.charcap,raw:d.n_raw.toLocaleString(LOC())}):'')
  +((d.seg&&d.seg.length&&d.seg_n!=null)?(d.seg_fallback?T(' · 장르 안 앵커 그림 {n}장 (작아서 장르 전체·앵커 통계로 보정)',{n:d.seg_n}):T(' · 장르 안 {n}장',{n:d.seg_n.toLocaleString(LOC())})):'')
  +T(' · 칩을 누르면 그 부위를 고정하고 뒤 부위만 다시 굴립니다. 굴리기 = 새 시드')}
// ── 색인 안내 (이식하면서 새로 붙인 것, 2026-09-10) ─────────────────────────
// 색인 약 960MB 은 앱에 담기지 않고 릴리즈에서 받는다. 준비되기 전에는 굴리기 화면을 감추고 이 안내만 보인다.
// ★진행률은 백엔드가 주는 `have`(다 받은 파일 + 받다 만 조각) 하나로 그린다 — 세는 곳이 둘이면 어긋난다.
const MB=n=>(n/1e6).toLocaleString(LOC(),{maximumFractionDigits:0})+'MB';
let IDX=null, ROLLED=false, POLL=null;
async function idxGet(url,opt){try{const r=await fetch(url+(url.indexOf('?')<0?'?':'&')+'lang='+tagrollLang(),opt);return await r.json()}catch(e){return {error:T('요청 실패 ({e})',{e:e.message})}}}
function paintIdx(s){
 IDX=s;
 $('#g_size').textContent=T('약 {size}',{size:MB(s.total||0)});
 $('#g_dir').textContent=s.dir?T('받는 자리: {dir}',{dir:s.dir}):'';
 const pct=s.total?Math.min(100,(s.have||0)/s.total*100):0;
 $('#g_fill').style.width=pct.toFixed(1)+'%';
 if(s.ready){
  $('#gate').classList.remove('show');$('#work').classList.add('show');
  if(!ROLLED){ROLLED=true;loadSlots()}
  return true}
 $('#gate').classList.add('show');$('#work').classList.remove('show');
 const dl=s.downloading;
 $('#g_go').hidden=!!dl; $('#g_stop').hidden=!dl;
 $('#g_state').textContent=s.error?T('멈췄습니다 — {e}',{e:SE(s.error)})
  :dl?T('받는 중 {have} / {total} ({pct}%) · {name} · {bps}/s',{have:MB(s.have||0),total:MB(s.total||0),pct:pct.toFixed(0),name:dl.name,bps:MB(dl.bps||0)})
  :s.cancelled?T('멈췄습니다 — 받은 데까지 두었습니다 ({have} / {total}). 다시 누르면 이어 받습니다.',{have:MB(s.have||0),total:MB(s.total||0)})
  :(s.have?T('받다 만 것이 있습니다 ({have} / {total}). 이어 받습니다.',{have:MB(s.have),total:MB(s.total||0)}):T('파일 {n}개를 받습니다.',{n:(s.missing||[]).length}));
 return false}
async function idxTick(){const s=await idxGet('../api/index');if(!s||s.error&&!s.dir){$('#g_state').textContent=s?SE(s.error)||T('상태를 못 읽었습니다'):T('상태를 못 읽었습니다');return}
 const ready=paintIdx(s);
 const busy=!!(s.downloading);
 clearTimeout(POLL);
 if(!ready||busy)POLL=setTimeout(idxTick,busy?700:3000)}
$('#g_go').onclick=async()=>{$('#g_go').hidden=true;$('#g_state').textContent=T('시작합니다…');await idxGet('../api/index/download',{method:'POST'});idxTick()};
$('#g_stop').onclick=async()=>{await idxGet('../api/index/cancel',{method:'POST'});idxTick()};
idxTick();

// 접었다 편 상태는 기억한다 (사용자 지시 2026-09-11 「고르기 패널을 접고펼 수 있게」) —
// 창을 닫았다 열어도 그대로다. 접어 두면 굴린 결과가 바로 위에 온다.
for (const id of ['pickbox','optbox','mod_nsfw','mod_expr','mod_pose','mod_scene']){
 const el=$('#'+id); if(!el)continue;
 try{const v=localStorage.getItem('tagroll_open_'+id); if(v!==null)el.open=(v==='1')}catch(e){}
 el.addEventListener('toggle',()=>{try{localStorage.setItem('tagroll_open_'+id,el.open?'1':'0')}catch(e){}})}

// ── 앱에 넣기 (이식하면서 새로 붙인 것, 2026-09-10) ──────────────────────────
// 묶음 줄마다 「넣기」. 인물 것(디자인·표정·포즈·NSFW)은 **캐릭터 카드**로, 씬은 **스타일 카드**로 간다 —
// 앱의 구분이 그렇다 (`edit_character` = 그 인물의 몸·의상·표정·포즈 · `edit_style_card` = 그림 전체에 걸리는 것).
// ★같은 이름의 블록이 있으면 갈아 끼우고 없으면 붙인다 (카메라 플러그인과 같은 처방).
// ★인물 자리는 지금 씬에 있는 캐릭터 카드를 **순서대로** 쓴다. 모자라면 「인물 N」 이라는 이름으로 새로 생긴다.
// ★★블록 이름에는 **접두어**를 붙인다 (사용자 지시 2026-09-11): 사용자가 손으로 만든 블록과 겹치지 않게,
// 그리고 「지금 씬에 넣기」가 **내 블록만** 골라 지울 수 있게. 지우고 나서 넣으므로 지난번 것이 섞이지 않는다
// (전에는 이번에 안 뽑힌 모듈의 옛 블록이 그대로 남았다).
// ★이름표도 언어를 따라간다 (사용자 지시 2026-09-11). 언어를 바꾸면 접두어와 블록 이름이 함께 바뀌므로,
//   지울 때는 **세 언어의 접두어 전부**를 본다 — 옛 언어로 넣어 둔 블록이 남지 않게.
const PREFIX={ko:'굴리기_',en:'Roll_',ja:'ロール_'};
const putPrefix=()=>PREFIX[tagrollLang()]||PREFIX.ko;
const PREFIXES=[PREFIX.ko,PREFIX.en,PREFIX.ja];
const isMine=l=>PREFIXES.some(x=>String(l||'').indexOf(x)===0);
const PUT={b_body:['char','신체'],b_wear:['char','복장'],b_expr:['char','표정'],b_pose:['char','포즈'],b_nsfw:['char','NSFW'],b_scene:['style','씬']};
const mySceneLabel=()=>putPrefix()+T('씬');
/** 지금 씬의 스타일 카드 블록과 캐릭터 카드 (블록마다 id 가 온다).
 *  ★★`peropix.scene()` 은 화면에 **살아 있는** 상태다. `action('get_workspace')` 는 **저장된 파일**을 읽어
 *    방금 손댄 것을 모르므로, 지울 대상을 놓친다 (게스트 실측 2026-09-11: 심어 둔 블록이 안 지워졌다).
 *    옛 앱에는 `scene()` 이 없으니 그때만 `get_workspace` 로 떨어진다. */
async function sceneState(){
 if(peropix.scene){const s=await peropix.scene().catch(()=>null);
  if(s)return {base:s.base||[],chars:s.chars||[]}}
 const w=await peropix.action('get_workspace').catch(()=>null);
 const gs=(w&&w.sceneGroups)||[];
 const g=gs.find(x=>x&&x.id===(w&&w.activeSceneGroup))||gs[0]||null;
 const pr=(g&&g.prompt)||{};
 return {base:pr.base||[],chars:pr.characters||[]}}
/** i번째 인물이 들어갈 카드 — 지금 씬의 카드를 순서대로 쓰고, 모자라면 「인물 N」 이라는 이름으로 새로 생긴다 */
function charAt(i,st){const c=st&&st.chars&&st.chars[i];return (c&&c.id)||T('인물 {n}',{n:i+1})}
async function putBlock(kind,target,label,tags,mode,blockId){
 const name=kind==='style'?'edit_style_card':'edit_character';
 const args={label:label,tags:tags,mode:mode||'replace',block:blockId||''};
 if(kind==='char')args.character=target;
 const r=await peropix.call({call:'action',name:name,args:args});
 if(!r.ok)return r.error||T('앱이 거절했습니다');
 if(r.result&&r.result.error)return r.result.error.message||JSON.stringify(r.result.error);
 return ''}
/** 내가 넣었던 블록을 **접두어로 전부** 걷어낸다 — 이번에 안 뽑힌 모듈의 지난 블록이 남지 않게.
 *  ★블록 id 로 지운다 (이름이 겹쳐도 정확하다). 사용자가 손으로 만든 블록은 접두어가 없으니 건드리지 않는다. */
async function clearMine(st){
 const s0=st||await sceneState();
 for(const b of s0.base)if(isMine(b&&b.label))await putBlock('style','',b.label,'','remove',b.id);
 for(const c of s0.chars)for(const b of (c.prompt||[]))if(isMine(b&&b.label))
  await putBlock('char',c.id,b.label,'','remove',b.id)}
function bundleText(id){const el=$('#'+id);if(!el)return '';const raw=el.textContent;
 return (el.classList.contains('empty')||raw==='(전부 없음)')?'':raw}
async function sendOne(id,btn){
 const t=bundleText(id);if(!t)return;
 const [kind,label]=PUT[id]||(id.startsWith('b_p')?['char','디자인']:['style','씬']);
 const i=id.startsWith('b_p')?Number(id.slice(3)):0;
 btn.disabled=true;const old=btn.textContent;btn.textContent=T('넣는 중…');
 const st=await sceneState();
 const err=await putBlock(kind,kind==='char'?charAt(i,st):'',putPrefix()+T(label),t);
 btn.textContent=err?T('실패'):T('넣었음');
 if(err)peropix.toast(T('앱이 거절했습니다: {e}',{e:err}));
 setTimeout(()=>{btn.textContent=old;btn.disabled=false},1200)}
async function sendAll(btn){
 btn.disabled=true;const old=btn.textContent;btn.textContent=T('넣는 중…');
 const st=await sceneState();
 await clearMine(st);   // ★먼저 내 블록을 전부 지운다 — 이번에 안 뽑힌 모듈의 지난 블록이 남지 않게
 // ★넣는 것은 **갈아 끼우기**다 (`replace` = 있으면 갈고 없으면 붙인다). `get_workspace` 는 **저장된 파일**을 읽어
 //   방금 넣은 블록을 모를 수 있는데(저장이 잠깐 뒤에 된다), 그때도 같은 이름이 둘이 되지 않는다 (실측 2026-09-11).
 let bad='';
 // ★인원과 상관없이 **같은 구성**이다 (사용자 지시 2026-09-12). 전에는 여럿일 때만 한 블록에 뭉쳤다.
 if(PN>1){for(let i=0;i<PN;i++){const p=P[i];if(!p||!p.cur)continue;
  const wear=new Set(SL.wearable||[]);
  const take=(inWear)=>p.cur.slots.filter(x=>x.chosen&&wear.has(x.slot)===inWear).map(x=>x.chosen.replace(/_/g,' ')).join(', ');
  const who=charAt(i,st);
  for(const [label,text] of [[T('신체'),take(false)],[T('복장'),take(true)],
                             [T('표정'),p.xcur?p.xcur.prompt:''],[T('포즈'),p.pcur?p.pcur.prompt:'']])
   if(text)bad=bad||await putBlock('char',who,putPrefix()+label,text)}}
 else for(const id of ['b_body','b_wear','b_expr','b_pose','b_nsfw']){const t=bundleText(id);
  if(t)bad=bad||await putBlock('char',charAt(0,st),putPrefix()+T(PUT[id][1]),t)}
 const sc=bundleText('b_scene'); if(sc)bad=bad||await putBlock('style','',mySceneLabel(),sc);
 btn.textContent=bad?T('실패'):T('넣었음');
 if(bad)peropix.toast(T('앱이 거절했습니다: {e}',{e:bad})); else peropix.toast(T('굴린 태그를 지금 씬에 넣었습니다'));
 setTimeout(()=>{btn.textContent=old;btn.disabled=false},1200)}
// 굴리기 사슬(디자인 → NSFW → 표정 → 포즈 → 씬)이 끝나기를 기다리는 자리 — 씬 모듈이 끝에서 알린다
let chainWait=null;
function chainDone(){if(chainWait){const f=chainWait;chainWait=null;f()}}
function whenChainDone(ms){return new Promise(res=>{chainWait=res;setTimeout(()=>{if(chainWait===res){chainWait=null;res()}},ms||60000)})}
/** 굴리고 나서 바로 넣는다 (사용자 지시 2026-09-11) */
async function rollAndPut(btn){
 btn.disabled=true;const old=btn.textContent;btn.textContent=T('굴리는 중…');
 const done=whenChainDone();
 await roll(true);
 await done;
 btn.textContent=T('넣는 중…');
 await sendAll(btn);
 btn.textContent=old;btn.disabled=false}

// ── 앱 언어를 따라간다 (사용자 결정 2026-09-11 「공식 플러그인은 세 언어를 기본으로」) ──────────
// 정적 문구는 `data-t` 표식이 달린 자리를 사전이 갈아 끼우고, 굴린 결과처럼 JS 가 그린 것은 여기서 다시 그린다.
function relabel(){
 applyStaticI18n();
 if(SL){renderPanel();
  const g=document.querySelector('#tdet .tgrid');if(g){g.dataset.on='';g.innerHTML='';fillTemps()}
  buildTop();updateTop()}
 if(cur)render(cur); if(ncur)nrender(ncur); if(xcur)xrender(xcur); if(pcur)prender(pcur); if(scur)srender(scur);
 renderTabs();
 if(IDX)paintIdx(IDX)}
(async()=>{
 let l='ko';
 try{l=await peropix.locale()}catch(e){l=(navigator.language||'ko').slice(0,2)}
 setTagrollLang(l);relabel();
 if(peropix.onLocale)peropix.onLocale(x=>{setTagrollLang(x);relabel()})})();
</script></body></html>
